name: Update Profile README

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/profile.json'
      - 'src/**'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate README and assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME || github.repository_owner }}
        run: npm run generate

      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          repository: Sahan-Chathumina-25/Sahan-Chathumina-25
          path: profile-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy generated files to profile repo
        run: |
          cp generated/README.md profile-repo/README.md
          cp assets/*.svg profile-repo/assets/

      - name: Commit and push to profile repo
        working-directory: profile-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto-update profile README and assets"
            git push
          fi
